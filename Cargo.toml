[package]
name = "colophon-mcp"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt", "io-std"] }

[build-dependencies]
bindgen = { version = "=0.73.2", default-features = false, features = ["runtime"] }
cc = { version = "=1.8.0", features = ["parallel"] }
